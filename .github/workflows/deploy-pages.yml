name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Remove this line once the scaffold branch is merged into main.
      - claude/merge-guardians-scaffold-x2ke18
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Runs tsc --noEmit first, so a type error fails the deploy.
      - run: npm run build

      # enablement turns Pages on via the API, so the repository setting does
      # not have to be flipped by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
